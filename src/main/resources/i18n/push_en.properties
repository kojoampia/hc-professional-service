# Push notification copy — English.
#
# These four bundles are the ONE set of user-visible strings that does not live in mobile/'s
# catalogues, and mobile/'s catalogues.spec.ts cannot see them. PushCopyBundleParityTest is their
# gate; keep all four in step in the same change, exactly as the four TypeScript catalogues are.
#
# MessageFormat: a value reached with arguments (push.message.body.named) is parsed by
# MessageFormat, where a single quote escapes the next character and '' is one literal quote. A
# value reached WITHOUT arguments is not parsed at all, so an apostrophe there is safe as written.
# Do not "fix" one by copying the other's quoting.
push.message.title=New message
push.message.body=You have a new message
push.message.body.named=New message from {0}
push.compliance.title=Action needed
push.compliance.body=A credential needs your attention
