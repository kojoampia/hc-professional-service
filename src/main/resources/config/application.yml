# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
  threads:
    virtual:
      enabled: true
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      access: unrestricted
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true

spring:
  application:
    name: HC-Professional-Service
  servlet:
    multipart:
      # OnboardingDocumentResource documents and enforces a 5,000,000-byte limit, but Spring's
      # DEFAULT max-file-size is 1MB and fires FIRST — at the container, before any controller code
      # runs. Every upload between 1MB and 5MB therefore failed with an opaque
      # MaxUploadSizeExceededException instead of the application's own clear message. Camera
      # captures land squarely in that range, which is how MOB8 would have hit it.
      #
      # 6MB is deliberately ABOVE the application's own 5MB check so the app's error message wins.
      # 8MB matches `client_max_body_size 8m` in deploy/prod-server/professional.abofonsa.com.conf
      # and deploy/docker/web-nginx.conf — raising it beyond that would just move the failure to
      # nginx, which returns a bare 413 with no useful body.
      max-file-size: 6MB
      max-request-size: 8MB
  cloud:
    consul:
      discovery:
        healthCheckPath: /management/health
        instanceId: professionalservice:${spring.application.instance-id:${random.value}}
        # must match the frontend contract path /services/professionalservice/**
        service-name: professionalservice
      config:
        watch:
          enabled: false
    #    function:
    #      definition: kafkaConsumer; kafkaProducer
    function:
      # The generated kafkaConsumer/kafkaProducer scaffold stays dormant, and
      # DomainEventPublisher's producer binding is created by StreamBridge rather than by a
      # declared function.
      definition: messageEvents;pushEvents
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          brokers: localhost:9092
      bindings:
        binding-out-0:
          content-type: text/plain
          group: hc-professional-ms
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: hc-professional-ms
        kafkaProducer-out-0:
          content-type: text/plain
          group: hc-professional-ms
        entityEvents-out-0:
          destination: hc.professional.entity
          content-type: application/json
        # onboarding.state rides the REGISTRATION topic, not the entity one, because it continues
        # the story registration.created starts: a consumer following one clinician's progress
        # subscribes to one topic and keys on accountId throughout. See
        # professional-onboarding-workflow.md § "Onboarding state events and the completion
        # contract".
        onboardingStateEvents-out-0:
          destination: hc.professional.registration
          content-type: application/json
        # Consumes the same topic this service publishes to, so a message.created event becomes a
        # websocket nudge for its recipient. A group is set on purpose: with one, a multi-instance
        # deployment delivers each event to a single instance. That is correct only while every
        # instance can reach every session — today there is one instance and an in-memory STOMP
        # broker, so if this is ever scaled out either drop the group (every instance sees every
        # event and pushes to whoever it holds) or put a real broker relay behind STOMP.
        messageEvents-in-0:
          destination: hc.professional.entity
          content-type: application/json
          group: hc-professional-ms-messaging
        # Push notifications (MOB9), consuming the same topic.
        #
        # THE GROUP MUST DIFFER from messageEvents-in-0 above. Two consumers sharing a group
        # compete for partitions, so each would see roughly half the events — producing
        # "notifications work about half the time", with nothing logged and nothing to point at.
        # A distinct group gives this consumer its own copy of every event.
        #
        # The scaling caveat on messageEvents applies here too but is less sharp: push has no
        # per-instance session state, so a multi-instance deployment delivering each event to one
        # instance is correct.
        pushEvents-in-0:
          destination: hc.professional.entity
          content-type: application/json
          group: hc-professional-ms-push
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: true
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: hc-professional-ms-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: hc-professional-ms-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

