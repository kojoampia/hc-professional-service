jhipster:
  clientApp:
    name: 'hcProfessionalServiceApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: hcProfessionalService@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Hc Professional Service API
    description: Hc Professional Service API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

application:
  notifications:
    push:
      # Off by default: a stack with no push credentials must start cleanly rather than warn per
      # event. Production turns it on and mounts the credentials — see deploy/.
      enabled: false
      # Android. Empty falls back to GOOGLE_APPLICATION_CREDENTIALS, which is how the container
      # is wired.
      fcm:
        credentials-path: ''
      # iOS, spoken directly rather than through Firebase — @capacitor/push-notifications registers
      # with APNs on iOS, so the token it returns is an APNs token that FCM would reject.
      apns:
        key-path: ''
        key-id: ''
        team-id: ''
        bundle-id: com.abofonsa.bridgecare.professional
        # true = api.push.apple.com, false = the sandbox. A TestFlight or debug build registers
        # with the sandbox and its token returns BadDeviceToken against production — which looks
        # exactly like an expired token. Match this to the build you are testing.
        production: true
